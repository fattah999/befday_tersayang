<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Untuk Ayah &amp; Mak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     EDIT ME: search for "EDIT:" comments below (in the <script>)
     to change names, messages, and memories for Ayah / Mak.
     ============================================================ */

  :root{
    --bg-1:#fff3e9;
    --bg-2:#ffe1d6;
    --ink:#5b2a3a;
    --ink-soft:#8a5a68;
    --rose:#e8798a;
    --rose-deep:#c85a72;
    --amber:#d98a3d;
    --amber-deep:#b96c28;
    --gold:#f0b429;
    --card:#fffdfb;
    --card-line: rgba(91,42,58,0.12);
    --accent: var(--amber);
    --accent-deep: var(--amber-deep);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    background: linear-gradient(180deg, var(--bg-1), var(--bg-2) 60%, var(--bg-1));
    overflow-x:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    margin:0;
    line-height:1.15;
  }
  p{margin:0;}
  button{font-family:inherit;}

  .screen{
    min-height:100svh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 8vh 7vw;
    position:relative;
    text-align:center;
  }

  .hidden{display:none !important;}

  /* ---------- Landing ---------- */
  #landing{
    position:relative;
    overflow:hidden;
  }
  .petal{
    position:absolute;
    top:-40px;
    font-size: 1.4rem;
    opacity:0.7;
    animation: fall linear infinite;
    pointer-events:none;
  }
  @keyframes fall{
    0%{ transform: translateY(-5vh) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.8; }
    100%{ transform: translateY(110vh) translateX(var(--drift,20px)) rotate(360deg); opacity:0; }
  }
  .eyebrow-note{
    font-size:0.95rem;
    color:var(--ink-soft);
    max-width:280px;
    margin-bottom: 0.6rem;
  }
  .landing-title{
    font-size: clamp(2rem, 9vw, 2.6rem);
    font-style:italic;
    margin-bottom: 0.3rem;
  }
  .landing-sub{
    font-size:1rem;
    color:var(--ink-soft);
    margin-bottom: 3rem;
    max-width: 320px;
  }
  .choice-row{
    display:flex;
    gap:1.1rem;
    z-index:2;
  }
  .choice-btn{
    border:none;
    border-radius: 26px;
    padding: 1.4rem 1.6rem;
    font-size:1.15rem;
    font-weight:600;
    color:#fff;
    cursor:pointer;
    box-shadow: 0 10px 24px -8px rgba(91,42,58,0.35);
    transition: transform .18s ease, box-shadow .18s ease;
    min-width: 128px;
  }
  .choice-btn:active{ transform: scale(0.95); }
  .choice-btn.ayah{ background: linear-gradient(155deg, var(--amber), var(--amber-deep)); }
  .choice-btn.mak{ background: linear-gradient(155deg, var(--rose), var(--rose-deep)); }

  /* ---------- Stage header / switch ---------- */
  #topbar{
    position:fixed;
    top:0; left:0; right:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 0.9rem 1.1rem;
    z-index:50;
    pointer-events:none;
  }
  #topbar button{
    pointer-events:auto;
    border:none;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(6px);
    color:var(--ink);
    font-size:0.85rem;
    font-weight:600;
    padding:0.5rem 0.9rem;
    border-radius:20px;
    box-shadow: 0 4px 12px rgba(91,42,58,0.15);
    cursor:pointer;
  }

  /* ---------- Hero message ---------- */
  .kicker{
    font-size:1rem;
    color: var(--accent-deep);
    font-weight:700;
    margin-bottom:0.5rem;
  }
  .hero-title{
    font-size: clamp(2.1rem, 10vw, 2.9rem);
    margin-bottom:1.3rem;
  }
  .hero-msg{
    max-width: 340px;
    font-size:1.05rem;
    line-height:1.65;
    color: var(--ink);
  }
  .scroll-cue{
    margin-top:3.2rem;
    font-size:0.9rem;
    color:var(--ink-soft);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.35rem;
  }
  .scroll-cue span.arrow{
    font-size:1.3rem;
    animation: bob 1.6s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(8px); }
  }

  /* ---------- Memories ---------- */
  #memories{ justify-content:flex-start; padding-top: 12vh; }
  .memories-title{
    font-size: clamp(1.7rem, 7.5vw, 2.2rem);
    margin-bottom: 2rem;
    max-width:320px;
  }
  .memory-list{
    display:flex;
    flex-direction:column;
    gap:0.9rem;
    width:100%;
    max-width: 380px;
  }
  .memory-card{
    background: var(--card);
    border: 1px solid var(--card-line);
    border-radius: 18px;
    padding: 1rem 1.15rem;
    text-align:left;
    font-size:0.98rem;
    line-height:1.5;
    box-shadow: 0 8px 20px -12px rgba(91,42,58,0.25);
    opacity:0;
    transform: translateY(14px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .memory-card.show{ opacity:1; transform:none; }
  .memory-card .heart-mark{
    color: var(--accent);
    margin-right:0.35rem;
  }

  /* ---------- Cake ---------- */
  #cake-section{ padding-top:8vh; }
  .cake-title{
    font-size: clamp(1.7rem, 7.5vw, 2.2rem);
    margin-bottom:0.4rem;
  }
  .cake-hint{
    color:var(--ink-soft);
    font-size:0.92rem;
    margin-bottom:2.2rem;
  }
  .cake-wrap{
    position:relative;
    width: 230px;
    padding-top: 58px;
  }
  .candles{
    position:absolute;
    top:6px;
    left:0; right:0;
    display:flex;
    justify-content:center;
    gap: 26px;
  }
  .candle{
    width:8px;
    height:34px;
    background: linear-gradient(180deg, #fff, var(--accent));
    border-radius:3px;
    position:relative;
    cursor:pointer;
  }
  .candle .flame{
    position:absolute;
    left:50%;
    top:-16px;
    width:12px;
    height:18px;
    transform: translateX(-50%);
    background: radial-gradient(circle at 50% 70%, var(--gold), #ff6b3d 70%, transparent 75%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    animation: flicker 0.5s ease-in-out infinite alternate;
    transition: opacity .25s ease, transform .25s ease;
  }
  @keyframes flicker{
    0%{ transform: translateX(-50%) scale(1) rotate(-3deg); }
    100%{ transform: translateX(-50%) scale(1.08) rotate(3deg); }
  }
  .candle.out .flame{
    opacity:0;
    transform: translateX(-50%) scale(0.4);
  }
  .candle .smoke{
    position:absolute;
    left:50%;
    top:-18px;
    width:4px;
    height:4px;
    background: rgba(150,150,150,0.5);
    border-radius:50%;
    opacity:0;
  }
  .candle.out .smoke{
    animation: smokeUp 1s ease-out forwards;
  }
  @keyframes smokeUp{
    0%{ opacity:0.6; transform: translate(-50%,0) scale(1); }
    100%{ opacity:0; transform: translate(-50%,-30px) scale(3); }
  }
  .cake-body{
    width:100%;
    filter: drop-shadow(0 14px 20px rgba(91,42,58,0.22));
  }
  .make-wish{
    margin-top:2rem;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:1.3rem;
    color: var(--accent-deep);
    opacity:0;
    transform: translateY(10px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .make-wish.show{ opacity:1; transform:none; }

  /* ---------- Fireworks / finale ---------- */
  #finale{ position:relative; overflow:hidden; padding-top:10vh; }
  #fw-canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }
  .finale-content{ position:relative; z-index:2; }
  .finale-title{
    font-size: clamp(2rem, 9vw, 2.7rem);
    margin-bottom:1rem;
  }
  .finale-msg{
    max-width:320px;
    font-size:1.05rem;
    line-height:1.65;
    margin: 0 auto 2.4rem;
  }
  .again-btn{
    border:none;
    border-radius:22px;
    padding:0.95rem 1.6rem;
    background: var(--card);
    color: var(--accent-deep);
    font-weight:700;
    font-size:0.98rem;
    box-shadow: 0 8px 20px -10px rgba(91,42,58,0.3);
    cursor:pointer;
  }

  @media (prefers-reduced-motion: reduce){
    .petal, .candle .flame, .scroll-cue span.arrow { animation: none !important; }
  }
</style>
</head>
<body>

<div id="topbar" class="hidden">
  <button id="switchBtn">🔁 Back</button>
  <button id="muteBtn">🔊</button>
</div>

<!-- Background song: put an MP3 named "song.mp3" in the SAME folder as this
     HTML file. Any filename works — just update the src below to match. -->
<audio id="bgSong" src="song.mp3" loop preload="auto" playsinline></audio>

<!-- ===================== LANDING ===================== -->
<section id="landing" class="screen">
  <div class="eyebrow-note">Sekeping laman kecil, penuh sayang</div>
  <h1 class="landing-title">Untuk insan tersayang</h1>
  <div class="choice-row">
    <button class="choice-btn ayah" data-person="ayah">Ayah 🩵</button>
    <button class="choice-btn mak" data-person="mak">Mak 💕</button>
  </div>
</section>
<!-- ===================== STAGE (filled dynamically) ===================== -->
<div id="stage" class="hidden">

  <section id="hero" class="screen">
    <div class="kicker" id="heroKicker"></div>
    <h2 class="hero-title" id="heroTitle"></h2>
    <p class="hero-msg" id="heroMsg"></p>
    <div class="scroll-cue"><span>Skrol ke bawah</span><span class="arrow">↓</span></div>
  </section>

  <section id="memories" class="screen">
    <h2 class="memories-title" id="memoriesTitle">Terima kasih untuk...</h2>
    <div class="memory-list" id="memoryList"></div>
  </section>

  <section id="cake-section" class="screen">
    <h2 class="cake-title">Jom nyalakan lilin</h2>
    <p class="cake-hint">Sentuh setiap lilin untuk tiup</p>
    <div class="cake-wrap">
      <div class="candles" id="candles"></div>
      <svg class="cake-body" viewBox="0 0 230 150" xmlns="http://www.w3.org/2000/svg">
        <rect x="20" y="95" width="190" height="45" rx="10" fill="#fbdcc4"/>
        <rect x="20" y="95" width="190" height="14" rx="7" fill="#ffffff"/>
        <rect x="35" y="55" width="160" height="45" rx="10" fill="#f7c1c9"/>
        <rect x="35" y="55" width="160" height="14" rx="7" fill="#ffffff"/>
        <rect x="55" y="18" width="120" height="42" rx="10" fill="#f7a6b2"/>
        <rect x="55" y="18" width="120" height="14" rx="7" fill="#ffffff"/>
        <circle cx="75" cy="30" r="3.5" fill="#e8798a"/>
        <circle cx="95" cy="26" r="3.5" fill="#d98a3d"/>
        <circle cx="118" cy="30" r="3.5" fill="#e8798a"/>
        <circle cx="140" cy="26" r="3.5" fill="#d98a3d"/>
        <circle cx="160" cy="30" r="3.5" fill="#e8798a"/>
      </svg>
    </div>
    <div class="make-wish" id="makeWish">Buat satu hajat... 🤍</div>
  </section>

  <section id="finale" class="screen">
    <canvas id="fw-canvas"></canvas>
    <div class="finale-content">
      <h2 class="finale-title" id="finaleTitle"></h2>
      <p class="finale-msg" id="finaleMsg"></p>

    </div>
  </section>

</div>

<script>
/* ============================================================
   EDIT ME — this is the only part you should need to change.
   Swap in your father's / mother's real name, your own memories,
   and any personal details. Keep the emoji if you like them.
   ============================================================ */
const CONFIG = {
  ayah: {
    accent: "amber",
    kicker: "Untuk Ayah",
    heroTitle: "Selamat Hari Jadi, Ayah",
    heroMsg: "Setiap hari yang Ayah bina untuk kami, kami simpan dalam hati. Hari ini, giliran kami pula doakan yang terbaik untuk Ayah.",
    memories: [
      "Bangun awal, balik lewat, semata-mata untuk pastikan kami cukup makan dan cukup sekolah.",
      "Diam-diam berkorban banyak benda untuk diri sendiri, supaya kami tak pernah rasa kurang.",
      "Ajar kami erti kerja keras dan tanggungjawab, tanpa perlu banyak cakap.",
      "Sentiasa jadi tempat kami rasa selamat, walaupun kadang kami lupa ucap terima kasih.",
    ],
    finaleTitle: "Kami sayang Ayah",
    finaleMsg: "Terima kasih sebab jadi tempat kami berteduh. Semoga Ayah sentiasa sihat, gembira, dan dilimpahi kasih sayang sepanjang tahun ini."
  },
  mak: {
    accent: "rose",
    kicker: "Untuk Mak",
    heroTitle: "Selamat Hari Jadi, Mak",
    heroMsg: "Maaf sebab ucapan ni sikit lewat — tapi sayang kami untuk Mak tak pernah lewat, dan tak pernah pudar.",
    memories: [
      "Malam-malam tak tidur sebab jaga kami waktu demam, tanpa sekali pun mengeluh.",
      "Tangan yang masak setiap hidangan dengan penuh kasih, walau penat macam mana sekalipun.",
      "Ajar kami erti sabar dan lembut hati, melalui cara Mak layan semua orang.",
      "Doa yang tak pernah putus, walau kami jauh atau kami lupa telefon."
    ],
    finaleTitle: "Kami sayang Mak",
    finaleMsg: "Walaupun ucapan ini lewat, doa kami untuk Mak tak pernah lewat. Terima kasih jadi Mak yang paling kuat dan paling penyayang."
  }
};
/* ============================================================
   End of editable section.
   ============================================================ */

const landing = document.getElementById('landing');
const stage = document.getElementById('stage');
const topbar = document.getElementById('topbar');
const root = document.documentElement;

// floating petals on landing
const petalEmojis = ['🌸','🕊️','✨','🤍'];
const petalHost = landing;
for(let i=0;i<10;i++){
  const p = document.createElement('div');
  p.className='petal';
  p.textContent = petalEmojis[i % petalEmojis.length];
  p.style.left = (Math.random()*90+3)+'%';
  p.style.setProperty('--drift', (Math.random()*60-30)+'px');
  p.style.animationDuration = (8+Math.random()*7)+'s';
  p.style.animationDelay = (Math.random()*8)+'s';
  petalHost.appendChild(p);
}

// ---------------- Background song ----------------
const bgSong = document.getElementById('bgSong');
const muteBtn = document.getElementById('muteBtn');
bgSong.volume = 0.55;

function startSong(){
  const p = bgSong.play();
  if(p && p.catch){
    p.catch(()=>{ /* browser blocked it; user can tap the speaker icon */ });
  }
}

muteBtn.addEventListener('click', ()=>{
  bgSong.muted = !bgSong.muted;
  muteBtn.textContent = bgSong.muted ? '🔇' : '🔊';
  if(!bgSong.muted && bgSong.paused){ startSong(); }
});

function openPerson(key){
  const data = CONFIG[key];
  root.style.setProperty('--accent', getComputedStyle(root).getPropertyValue(data.accent==='rose' ? '--rose' : '--amber'));
  root.style.setProperty('--accent-deep', getComputedStyle(root).getPropertyValue(data.accent==='rose' ? '--rose-deep' : '--amber-deep'));

  document.getElementById('heroKicker').textContent = data.kicker;
  document.getElementById('heroTitle').textContent = data.heroTitle;
  document.getElementById('heroMsg').textContent = data.heroMsg;
  document.getElementById('finaleTitle').textContent = data.finaleTitle;
  document.getElementById('finaleMsg').textContent = data.finaleMsg;

  const list = document.getElementById('memoryList');
  list.innerHTML = '';
  data.memories.forEach(m=>{
    const el = document.createElement('div');
    el.className='memory-card';
    el.innerHTML = '<span class="heart-mark">♥</span>'+m;
    list.appendChild(el);
  });

  // rebuild candles
  const candleWrap = document.getElementById('candles');
  candleWrap.innerHTML = '';
  for(let i=0;i<5;i++){
    const c = document.createElement('div');
    c.className='candle';
    c.innerHTML = '<div class="flame"></div><div class="smoke"></div>';
    c.addEventListener('click', onCandleTap);
    candleWrap.appendChild(c);
  }
  document.getElementById('makeWish').classList.remove('show');

  landing.classList.add('hidden');
  stage.classList.remove('hidden');
  topbar.classList.remove('hidden');
  window.scrollTo({top:0, behavior:'instant'});

  observeMemories();
}

document.querySelectorAll('.choice-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    startSong();
    openPerson(btn.dataset.person);
  });
});
document.getElementById('switchBtn').addEventListener('click', backToLanding);
document.getElementById('againBtn').addEventListener('click', backToLanding);

function backToLanding(){
  stage.classList.add('hidden');
  topbar.classList.add('hidden');
  landing.classList.remove('hidden');
  window.scrollTo({top:0, behavior:'instant'});
}

function onCandleTap(e){
  const c = e.currentTarget;
  if(c.classList.contains('out')) return;
  c.classList.add('out');
  const remaining = document.querySelectorAll('#candles .candle:not(.out)').length;
  if(remaining===0){
    document.getElementById('makeWish').classList.add('show');
    burstConfetti();
  }
}

function burstConfetti(){
  const colors = ['#e8798a','#d98a3d','#f0b429','#fff'];
  const wrap = document.querySelector('.cake-wrap');
  for(let i=0;i<26;i++){
    const piece = document.createElement('div');
    const size = 6+Math.random()*5;
    piece.style.position='absolute';
    piece.style.left='50%';
    piece.style.top='0';
    piece.style.width=size+'px';
    piece.style.height=size+'px';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
    piece.style.pointerEvents='none';
    piece.style.zIndex=5;
    const angle = Math.random()*Math.PI*2;
    const dist = 60+Math.random()*90;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist - 40;
    piece.animate([
      { transform:'translate(0,0) rotate(0deg)', opacity:1 },
      { transform:`translate(${dx}px, ${dy+140}px) rotate(${Math.random()*400}deg)`, opacity:0 }
    ], { duration: 1000+Math.random()*500, easing:'cubic-bezier(.2,.7,.3,1)' });
    wrap.appendChild(piece);
    setTimeout(()=>piece.remove(), 1600);
  }
}

// memory cards reveal on scroll
function observeMemories(){
  const cards = document.querySelectorAll('.memory-card');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(en=>{
      if(en.isIntersecting){ en.target.classList.add('show'); }
    });
  }, {threshold:0.3});
  cards.forEach(c=>io.observe(c));
}

// ---------------- Fireworks ----------------
const canvas = document.getElementById('fw-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let fwActive = false;
let fwTimer = null;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function resizeCanvas(){
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener('resize', resizeCanvas);

function launchFirework(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const x = w*0.2 + Math.random()*w*0.6;
  const y = h*0.25 + Math.random()*h*0.3;
  const colors = ['#e8798a','#d98a3d','#f0b429','#ffffff','#c85a72'];
  const color = colors[Math.floor(Math.random()*colors.length)];
  const count = reduceMotion ? 12 : 26;
  for(let i=0;i<count;i++){
    const angle = (Math.PI*2*i)/count + Math.random()*0.2;
    const speed = 1.4+Math.random()*2.2;
    particles.push({
      x, y,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      life: 1,
      color
    });
  }
}

function fwLoop(){
  const w = canvas.clientWidth, h = canvas.clientHeight;
  ctx.clearRect(0,0,w,h);
  particles.forEach(p=>{
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.03;
    p.life -= 0.014;
  });
  particles = particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    ctx.globalAlpha = Math.max(p.life,0);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,2.4,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  if(fwActive){ requestAnimationFrame(fwLoop); }
}

const finaleSection = document.getElementById('finale');
const fwObserver = new IntersectionObserver((entries)=>{
  entries.forEach(en=>{
    if(en.isIntersecting){
      resizeCanvas();
      if(!fwActive){
        fwActive = true;
        requestAnimationFrame(fwLoop);
      }
      launchFirework();
      if(fwTimer) clearInterval(fwTimer);
      fwTimer = setInterval(launchFirework, reduceMotion ? 2400 : 1400);
    } else {
      if(fwTimer) clearInterval(fwTimer);
      fwActive = false;
    }
  });
}, {threshold:0.4});
fwObserver.observe(finaleSection);
</script>
</body>
</html>
